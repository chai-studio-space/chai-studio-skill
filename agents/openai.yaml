interface:
  display_name: "Chai Studio MCP"
  short_description: "Explore websites with DevTools MCP and create Chai artifacts"
  brand_color: "#B8422E"
  default_prompt: "Use $chai-studio-skill to verify Chai Studio MCP + Chrome DevTools MCP availability, explore the target website, extract structured design data, and create preset/ruleset/application artifacts with exact tool names."
dependencies:
  tools:
    - type: "mcp"
      value: "chai-studio"
      description: "Chai Studio MCP server for applications, presets, rulesets, and artifact creation."
    - type: "mcp"
      value: "chrome-devtools"
      description: "Chrome DevTools MCP server for website exploration and design extraction."
policy:
  allow_implicit_invocation: true
